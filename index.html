<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Trendfarm</title>
    <script>
        // Rileva la lingua del browser
        var lingua = navigator.language || navigator.userLanguage; 
        
        // Se la lingua inizia con "it", vai alla cartella italiana, altrimenti vai in inglese
        if (lingua.indexOf('it') === 0) {
            window.location.href = "./it/index.html";
        } else {
            window.location.href = "./en/index.html";
        }
    </script>
</head>
<body>
    <!-- Pagina di sicurezza se i JavaScript sono disattivati -->
    <p style="text-align:center; margin-top:50px; font-family:Arial;">
        <a href="./it/index.html">Italiano</a> | <a href="./en/index.html">English</a>
    </p>
</body>
</html>
