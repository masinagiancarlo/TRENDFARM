<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Professional algorithmic trading platform with 5 independent strategic engines. Download the free 30-day TRIAL version.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts - Trendfarm</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: url('../home_ufficio_trendfarm.png'); 
            background-size: cover;            
            background-position: center;       
            background-repeat: no-repeat;      
            background-attachment: fixed;      
        }
        
        /* NAVBAR */
        .navbar { background-color: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: fixed; top: 0; width: 100%; z-index: 1000; }
        
        /* LOGO COORDINATO (Immagine + Testo Bicolore) */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .img-logo {
            height: 38px;
            width: auto;
        }
        .testo-logo {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .colore-trend { color: #dca122; } /* Oro dal logo */
        .colore-farm { color: #0b2f8f; }  /* Blu dal logo */

        
        /* NAVBAR */
        .navbar { background-color: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: fixed; top: 0; width: 100%; z-index: 1000; }
        .logo { color: #fff; font-size: 1.5rem; font-weight: bold; text-decoration: none; }
        .nav-container { display: flex; align-items: center; gap: 30px; }
        .nav-links { list-style: none; display: flex; gap: 20px; }
        .nav-links a { color: #e0e0e0; text-decoration: none; font-size: 1rem; font-weight: 500; }
        .nav-links a:hover { color: #00bcd4; }
        .dropdown { position: relative; display: inline-block; }
        .dropdown-btn { background: rgba(255, 255, 255, 0.1); color: white; padding: 8px 16px; font-size: 1rem; border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .dropdown-content { display: none; position: absolute; right: 0; background-color: rgba(0, 0, 0, 0.9); min-width: 140px; box-shadow: 0px 8px 16px rgba(0,0,0,0.5); border-radius: 0 0 4px 4px; z-index: 1; margin-top: 0; padding-top: 5px; }
        .dropdown-content a { color: white; padding: 12px 16px; text-decoration: none; display: flex; gap: 10px; font-size: 0.95rem; }
        .dropdown-content a:hover { background-color: #00bcd4; color: black; }
        .dropdown:hover .dropdown-content { display: block; }

        /* CONTENITORE CENTRALE */
        .main-content {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 140px 20px 40px 20px;
        }

        .scheda-contenuto {
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);          
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .scheda-contenuto h2 {
            font-size: 2.2rem;
            margin-bottom: 25px;
            color: #00bcd4;                        
            border-bottom: 2px solid rgba(0, 188, 212, 0.3);
            padding-bottom: 10px;
            text-align: center;
        }

        /* STRUTTURA DEL MODULO (FORM) */
        .form-gruppo {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-gruppo label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #e0e0e0;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: #00bcd4;
            background: rgba(255, 255, 255, 0.15);
        }

        select.form-control {
            cursor: pointer;
        }
        select.form-control option {
            background-color: #1a1a1a;
            color: white;
        }

        .btn-invia {
            width: 100%;
            padding: 14px;
            background-color: #00bcd4;
            color: black;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-invia:hover {
            background-color: #ffffff;
        }

        @media (max-width: 768px) {
            .navbar { flex-direction: column; gap: 10px; }
            .nav-container { flex-direction: column; gap: 10px; width: 100%; }
            .scheda-contenuto { padding: 25px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">TRENDFARM</a>
        <div class="nav-container">
            <!-- MENU INGLESE -->
            <ul class="nav-links">
                <li><a href="about-us.html">About us</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="prices.html">Prices</a></li>
                <li><a href="contacts.html" style="color: #00bcd4;">Contacts</a></li>
            </ul>
            <div class="dropdown">
                <button class="dropdown-btn">🇬🇧 English ▾</button>
                <div class="dropdown-content">
                    <a href="../it/contatti.html">🇮🇹 Italiano</a>
                    <a href="contacts.html">🇬🇧 English</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="scheda-contenuto">
            <h2>Contact Us</h2>
            
            <form action="https://formspree.io/f/mdaqvwbb" method="POST">
                
                <div class="form-gruppo">
                    <label for="nome">Name / Company</label>
                    <input type="text" name="name" id="nome" class="form-control" placeholder="Enter your name" required>
                </div>

                <div class="form-gruppo">
                    <label for="email">Email Address</label>
                    <input type="email" name="_replyto" id="email" class="form-control" placeholder="name@example.com" required>
                </div>

                <!-- OGGETTO IN INGLESE MA CON VALORI MAI TRADOTTI PER I FILTRI DELLA TUA EMAIL -->
                <div class="form-gruppo">
                    <label for="oggetto">Subject</label>
                    <select name="subject" id="oggetto" class="form-control" required>
                        <option value="" disabled selected>Select an option...</option>
                        <option value="Informazioni Generali">General Information</option>
                        <option value="Informazioni Commerciali">Commercial Information</option>
                        <option value="Richiesta Preventivo">Quote Request</option>
                        <option value="Assistenza Tecnica">Technical Support</option>
                        <option value="Altro">Other</option>
                    </select>
                </div>

                <div class="form-gruppo">
                    <label for="messaggio">Message</label>
                    <textarea name="message" id="messaggio" class="form-control" rows="5" placeholder="Write your request here..." required></textarea>
                </div>

                <button type="submit" class="btn-invia">Send Message</button>
            </form>

        </div>
    </main>

</body>
</html>
