<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Check the official NEXUS MATRIX price list. Choose the commercial license that best suits your algorithmic trading needs.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prices - Trendfarm</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: url('../home_ufficio_trendfarm.png'); 
            background-size: cover;            
            background-position: center;       
            background-repeat: no-repeat;      
            background-attachment: fixed;      
        }
        .navbar { background-color: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: fixed; top: 0; width: 100%; z-index: 1000; }
        .logo-container { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .img-logo { height: 38px; width: auto; }
        .testo-logo { font-size: 1.5rem; font-weight: bold; letter-spacing: 1px; }
        .colore-trend { color: #dca122; }
        .colore-farm { color: #ffffff; }  /* Bianco dal logo */

        .nav-container { display: flex; align-items: center; gap: 30px; }
        .nav-links { list-style: none; display: flex; gap: 20px; }
        .nav-links a { color: #e0e0e0; text-decoration: none; font-size: 1rem; font-weight: 500; }
        .nav-links a:hover { color: #00bcd4; }
        
        /* DROPDOWN LINGUE NAVBAR */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-btn { background: rgba(255, 255, 255, 0.1); color: white; padding: 8px 16px; font-size: 1rem; border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .dropdown-content { display: none; position: absolute; right: 0; background-color: rgba(0, 0, 0, 0.9); min-width: 140px; box-shadow: 0px 8px 16px rgba(0,0,0,0.5); border-radius: 0 0 4px 4px; z-index: 1; margin-top: 0; padding-top: 5px; }
        .dropdown-content a { color: white; padding: 12px 16px; text-decoration: none; display: flex; gap: 10px; font-size: 0.95rem; text-align: left; }
        .dropdown-content a:hover { background-color: #00bcd4; color: black; }
        .dropdown:hover .dropdown-content { display: block; }
        
        .main-content { flex-grow: 1; display: flex; justify-content: center; align-items: center; padding: 140px 20px 40px 20px; }
        .scheda-contenuto { background-color: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 40px; border-radius: 12px; max-width: 800px; width: 100%; color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        .scheda-contenuto h2 { font-size: 2.2rem; margin-bottom: 20px; color: #00bcd4; border-bottom: 2px solid rgba(0, 188, 212, 0.3); padding-bottom: 10px; }
        
        #testo-dinamico { font-size: 1.1rem; line-height: 1.8; color: #e0e0e0; white-space: pre-line; text-align: left; margin-bottom: 30px; }
        
        /* CONTENITORE MODULO INTERNO */
        .sezione-richiesta-prezzi { max-width: 450px; margin: 20px auto 0 auto; background: rgba(255, 255, 255, 0.03); padding: 25px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.05); text-align: left; }
        .sezione-richiesta-prezzi h3 { font-size: 1.2rem; color: #00bcd4; margin-bottom: 15px; text-align: center; }
        .sezione-richiesta-prezzi input { width: 100%; padding: 12px; margin-bottom: 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: white; font-size: 0.95rem; }
        .sezione-richiesta-prezzi input:focus { outline: none; border-color: #00bcd4; }
        
        .btn-invia-prezzi { display: block; width: 100%; padding: 12px; background-color: #00bcd4; color: black; border: none; border-radius: 4px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; text-align: center; font-family: inherit; }
        .btn-invia-prezzi:hover { background-color: #ffffff; }

        /* Ottimizzazione Universale per Visualizzazione su Smartphone */
        @media (max-width: 768px) {
            /* 1. Gestione della Navbar e dei Menu verticali */
            .navbar { flex-direction: column; gap: 10px; padding: 15px; }
            .nav-container { flex-direction: column; gap: 10px; width: 100%; }
            .nav-links { flex-direction: column; gap: 12px; text-align: center; }
            
            /* 2. Gestione del Menu Lingue (Dropdown) */
            .dropdown { width: 100%; text-align: center; }
            .dropdown-btn { width: 100%; justify-content: center; }
            .dropdown-content { position: relative; width: 100%; }
            
            /* 3. Spaziatura del Contenitore Centrale */
            .main-content { padding: 160px 20px 40px 20px; }
            .scheda-contenuto { padding: 25px; }
            
            /* 4. RIMPCIOLLIMENTO DEI CARATTERI SU MOBILE */
            .titolo-principale { font-size: 2.2rem !important; line-height: 1.3 !important; }
            .scheda-contenuto h2 { font-size: 1.6rem !important; border-bottom-width: 1px !important; padding-bottom: 8px !important; }
            #testo-dinamico, #testo-altro, .testo-notifica { font-size: 0.95rem !important; line-height: 1.6 !important; }
            .nome-versione { font-size: 1.1rem !important; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo-container">
            <img src="../logo.png" alt="Trendfarm Logo" class="img-logo">
            <div class="testo-logo">
                <span class="colore-trend">TREND</span><span class="colore-farm">FARM</span>
            </div>
        </a>
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="about-us.html">About us</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="prices.html" style="color: #00bcd4;">Prices</a></li>
                <li><a href="contacts.html">Contacts</a></li>
            </ul>
            
            <div class="dropdown">
                <button class="dropdown-btn">🇬🇧 English ▾</button>
                <div class="dropdown-content">
                    <a href="../it/prezzi.html">🇮🇹 Italiano</a>
                    <a href="prices.html">🇬🇧 English</a>
                </div>
            </div>
        </div>
    </nav>
    <main class="main-content">
        <div class="scheda-contenuto">
            <h2>Price List</h2>
            <div id="testo-dinamico">Loading price list...</div>
            
            <!-- UNLIMITED AJAX FORMSUBMIT MODULE FOR PRICES -->
            <div class="sezione-richiesta-prezzi">
                <h3>Try the 30-day TRIAL version</h3>
                <form class="mini-form-prezzi">
                    <input type="text" name="user_name" placeholder="Enter your Name / Company" required style="width: 100%; display: block;">
                    <input type="email" name="user_email" placeholder="Enter your Email address" required style="width: 100%; display: block;">
                    <button type="submit" class="btn-invia-prezzi">Download NEXUS MATRIX GOLD</button>
                </form>
            </div>
        </div>
    </main>

    <script>
        // 1. Fetch dynamic text files and convert double asterisks to strong tags
        fetch('testo-prices.txt')
            .then(response => { if (!response.ok) throw new Error('File not found'); return response.text(); })
            .then(data => { 
                let testoFormattato = data.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                document.getElementById('testo-dinamico').innerHTML = testoFormattato; 
            })
            .catch(error => { document.getElementById('testo-dinamico').innerText = "Error loading prices."; });

        // 2. New AJAX logic for FormSubmit (Sends data seamlessly to info-en@trendfarm.it)
        const formPrezzi = document.querySelector('.mini-form-prezzi');
        if (formPrezzi) {
            formPrezzi.addEventListener('submit', function(e) {
                e.preventDefault();
                const submitBtn = formPrezzi.querySelector('button[type="submit"]');
                const vecchioTesto = submitBtn.innerText;
                submitBtn.innerText = "Sending...";
                submitBtn.disabled = true;

                // Create the data layout requested by FormSubmit
                const formData = new FormData();
                formData.append('name', formPrezzi.querySelector('input[name="user_name"]').value);
                formData.append('email', formPrezzi.querySelector('input[name="user_email"]').value);
                formData.append('subject', 'Richiesta Nexus Trial - Dalla pagina Prezzi (EN)');
                formData.append('_captcha', 'false'); // Disables visual captcha screens

                // Asynchronous post transmission targeting the English FormSubmit endpoint
                fetch('https://formsubmit.co/info@trendfarm.it', {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                })
                .then(response => {
                    // Success: jumps straight to the English thanks page with direct zip download
                    window.location.href = 'https://trendfarm-labs.github.io/trendfarm/en/thanks.html';
                })
                .catch(error => {
                    // Fail-safe redirect fallback to keep the user experience smooth
                    window.location.href = 'https://trendfarm-labs.github.io/trendfarm/en/thanks.html';
                });
            });
        }
    </script>
</body>
</html>
