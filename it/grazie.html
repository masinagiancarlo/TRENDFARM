<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servizio Inoltrato - Trendfarm</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: url('../home_ufficio_trendfarm.png'); 
            background-size: cover;            
            background-position: center;       
            background-repeat: no-repeat;      
            background-attachment: fixed;      
        }
        .navbar { background-color: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: fixed; top: 0; width: 100%; z-index: 1000; }
        .logo-container { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .img-logo { height: 38px; width: auto; }
        .testo-logo { font-size: 1.5rem; font-weight: bold; letter-spacing: 1px; }
        .colore-trend { color: #dca122; }
        .colore-farm { color: #0b2f8f; }
        .nav-container { display: flex; align-items: center; gap: 30px; }
        .nav-links { list-style: none; display: flex; gap: 20px; }
        .nav-links a { color: #e0e0e0; text-decoration: none; font-size: 1rem; font-weight: 500; }
        .nav-links a:hover { color: #00bcd4; }
        .main-content { flex-grow: 1; display: flex; justify-content: center; align-items: center; padding: 140px 20px 40px 20px; }
        .scheda-contenuto { background-color: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 50px 40px; border-radius: 12px; max-width: 750px; width: 100%; color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        
        .scheda-contenuto h2 { font-size: 2.4rem; margin-bottom: 25px; color: #00bcd4; border-bottom: 2px solid rgba(0, 188, 212, 0.3); padding-bottom: 12px; }
        .testo-notifica { font-size: 1.25rem; line-height: 1.8; color: #ffffff; font-weight: 400; margin-bottom: 30px; }
        
        /* PULSANTI COORDINATI */
        .contenitore-bottoni { display: flex; flex-direction: column; gap: 18px; align-items: center; margin-bottom: 10px; }
        
        .btn-download-diretto {
            display: inline-block;
            max-width: 340px;
            width: 100%;
            padding: 14px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            background-color: #00bcd4;
            color: #000000;
            border: 1px solid #00bcd4;
            border-radius: 4px;
            transition: background 0.2s, border-color 0.2s, transform 0.2s;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 188, 212, 0.3);
        }
        .btn-download-diretto:hover { background-color: #ffffff; border-color: #ffffff; transform: translateY(-2px); }

        .btn-ok {
            display: inline-block;
            max-width: 180px;
            width: 100%;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            background-color: transparent;
            color: #aaaaaa;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            cursor: pointer;
        }
        .btn-ok:hover { background-color: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.5); color: #ffffff; }
        
        @media (max-width: 768px) { .navbar { flex-direction: column; gap: 10px; } .nav-container { flex-direction: column; gap: 10px; width: 100%; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo-container">
            <img src="../logo.png" alt="Logo Trendfarm" class="img-logo">
            <div class="testo-logo">
                <span class="colore-trend">TREND</span><span class="colore-farm">FARM</span>
            </div>
        </a>
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="chi-siamo.html">Chi siamo</a></li>
                <li><a href="prodotti.html">Prodotti</a></li>
                <li><a href="prezzi.html">Prezzi</a></li>
                <li><a href="contatti.html">Contatti</a></li>
            </ul>
        </div>
    </nav>
    <main class="main-content">
        <div class="scheda-contenuto">
            <h2>Richiesta Ricevuta!</h2>
            <p class="testo-notifica">
                Grazie per l'interesse. Clicca sul pulsante azzurro qui sotto per scaricare immediatamente l'archivio compresso di NEXUS MATRIX ed avviare la tua prova.
            </p>
            
            <div class="contenitore-bottoni">
                <!-- IL VERO LINK DI DOWNLOAD AGGIORNATO AL NUOVO USERNAME -->
                <a href="https://trendfarm-labs.github.io/trendfarm/nexus_matrix.zip" download class="btn-download-diretto">Scarica la TRIAL</a>
                
                <!-- BOTTONE DI RITORNO FLUIDO -->
                <a href="prodotti.html" class="btn-ok">Torna al sito</a>
            </div>
        </div>
    </main>
</body>
</html>
