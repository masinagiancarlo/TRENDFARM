<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trendfarm - IT</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: url('../home_ufficio_trendfarm.png'); 
            background-size: cover;            
            background-position: center;       
            background-repeat: no-repeat;      
            background-attachment: fixed;      
        }
        .navbar {
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }
        .logo { color: #fff; font-size: 1.5rem; font-weight: bold; text-decoration: none; }
        .nav-container { display: flex; align-items: center; gap: 30px; }
        .nav-links { list-style: none; display: flex; gap: 20px; }
        .nav-links a { color: #e0e0e0; text-decoration: none; font-size: 1rem; font-weight: 500; }
        .nav-links a:hover { color: #00bcd4; }
        
        /* STRUTTURA DEL MENU A DISCESA (DROPDOWN) */
        .dropdown {
            position: relative;
            display: inline-block;
        }
        /* Il bottone principale del menu */
        .dropdown-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px 16px;
            font-size: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        /* La lista delle lingue nascosta di default */
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: rgba(0, 0, 0, 0.9);
            min-width: 140px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.5);
            border-radius: 4px;
            z-index: 1;
            margin-top: 5px;
        }
        /* I link dentro il menu a discesa */
        .dropdown-content a {
            color: white;
            padding: 12px 16px;
            text-decoration: none;
            display: flex;
            gap: 10px;
            font-size: 0.95rem;
        }
        .dropdown-content a:hover { background-color: #00bcd4; color: black; }
        /* Mostra il menu quando si passa il mouse sopra */
        .dropdown:hover .dropdown-content { display: block; }

        .main-content { flex-grow: 1; display: flex; justify-content: center; align-items: center; padding: 100px 20px; }
        .titolo-principale { color: white; font-size: 3.5rem; text-align: center; text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.8); }
        
        @media (max-width: 768px) {
            .navbar { flex-direction: column; gap: 10px; }
            .nav-container { flex-direction: column; gap: 10px; width: 100%; }
            .dropdown { width: 100%; text-align: center; }
            .dropdown-btn { width: 100%; justify-content: center; }
            .dropdown-content { position: relative; width: 100%; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">TRENDFARM</a>
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="chi-siamo.html">Chi siamo</a></li>
                <li><a href="prodotti.html">Prodotti</a></li>
                <li><a href="download.html">Download</a></li>
                <li><a href="contatti.html">Contatti</a></li>
            </ul>
            
            <!-- MENU A DISCESA DELLE LINGUE -->
            <div class="dropdown">
                <button class="dropdown-btn">🇮🇹 Italiano ▾</button>
                <div class="dropdown-content">
                    <a href="index.html">🇮🇹 Italiano</a>
                    <a href="../en/index.html">🇬🇧 English</a>
                    <!-- In futuro ti basterà aggiungere qui sotto le nuove nazioni così: -->
                    <!-- <a href="../es/index.html">🇪🇸 Español</a> -->
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <h1 class="titolo-principale">Benvenuti in Trendfarm</h1>
    </main>

</body>
</html>
