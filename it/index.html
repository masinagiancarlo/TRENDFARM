<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trendfarm - IT</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            /* Recuperiamo l'immagine dalla cartella superiore usando ../ */
            background-image: url('../home_ufficio_trendfarm.png'); 
            background-size: cover;            
            background-position: center;       
            background-repeat: no-repeat;      
            background-attachment: fixed;      
        }
        .navbar {
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }
        .logo { color: #fff; font-size: 1.5rem; font-weight: bold; text-decoration: none; }
        .nav-container { display: flex; align-items: center; gap: 30px; }
        .nav-links { list-style: none; display: flex; gap: 20px; }
        .nav-links a { color: #e0e0e0; text-decoration: none; font-size: 1rem; font-weight: 500; }
        .nav-links a:hover { color: #00bcd4; }
        
        /* SELETTORE LINGUA CON EMOTICON BANDIERE */
        .lang-switcher { display: flex; gap: 10px; font-size: 1.3rem; }
        .lang-switcher a { text-decoration: none; opacity: 0.6; transition: opacity 0.2s; }
        .lang-switcher a.active { opacity: 1; border-bottom: 2px solid #00bcd4; }
        .lang-switcher a:hover { opacity: 1; }

        .main-content { flex-grow: 1; display: flex; justify-content: center; align-items: center; padding: 100px 20px; }
        .titolo-principale { color: white; font-size: 3.5rem; text-align: center; text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.8); }
        
        @media (max-width: 768px) {
            .navbar { flex-direction: column; gap: 10px; }
            .nav-container { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">TRENDFARM</a>
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="chi-siamo.html">Chi siamo</a></li>
                <li><a href="prodotti.html">Prodotti</a></li>
                <li><a href="download.html">Download</a></li>
                <li><a href="contatti.html">Contatti</a></li>
            </ul>
            <!-- Cambia lingua: le bandiere usano le emoji di sistema (leggere e veloci) -->
            <div class="lang-switcher">
                <a href="index.html" class="active" title="Italiano">🇮🇹</a>
                <a href="../en/index.html" title="English">🇬🇧</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <h1 class="titolo-principale">Benvenuti in Trendfarm</h1>
    </main>

</body>
</html>
